<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sterben · Emblemas</title>
<link rel="icon" href="img/sterben-emblema.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body data-pagina="emblemas">

<header class="navbar" id="div_navbar"></header>
<aside class="menu-lateral" id="div_menu_lateral"></aside>

<div class="container">
<main class="principal">
    <div id="div_aviso"></div>

    <div class="titulo-pagina">
        <p class="sobretitulo">Conquistas</p>
        <h1 id="div_titulo">Emblemas</h1>
        <p id="div_subtitulo">Cada emblema conta um pedaço da história: quando você jogou, o que conquistou e o quanto foi difícil.</p>
    </div>

    <div id="div_conteudo"><p class="carregando">Buscando emblemas... (pode levar alguns segundos)</p></div>

</main>
</div>

<div class="modal-fundo" id="div_modal_fundo" onclick="clicouNoFundo(event)">
    <div class="modal">
        <button class="modal-fechar" id="btn_modal_fechar" aria-label="Fechar" onclick="fecharEmblema()">×</button>
        <div id="div_modal_conteudo"></div>
    </div>
</div>

<footer class="rodape">
    <p>Sterben · Projeto Individual · São Paulo Tech School · 2026</p>
    <p>Projeto acadêmico sem vínculo com a Roblox Corporation.</p>
</footer>

<script src="js/layout.js"></script>
<script src="js/tema.js"></script>
<script src="js/dados-exemplo.js"></script>
<script src="js/roblox.js"></script>
<script src="js/emblemas.js"></script>
</body>
</html>
